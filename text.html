<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Check-in</title>
<style>
  :root { --bg:#faf8f5; --card:#ffffff; --ink:#1f1d1a; --muted:#6b665f; --accent:#2f5d3a; --line:#e6e1d9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --card:#201f1c; --ink:#f1ede6; --muted:#a59f95; --accent:#7fb38b; --line:#34322d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .why { color:var(--muted); margin:0 0 18px; font-size:14px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; white-space:pre-wrap; margin:0 0 16px; }
  a.btn, button.btn { display:block; width:100%; text-align:center; padding:14px; border-radius:12px; font-size:17px; font-weight:600; text-decoration:none; border:0; cursor:pointer; margin:0 0 10px; }
  .primary { background:var(--accent); color:#fff; }
  .secondary { background:transparent; color:var(--ink); border:1px solid var(--line) !important; }
  .note { color:var(--muted); font-size:13px; margin-top:14px; }
  .err { color:#b03030; }
</style>
</head>
<body>
<main>
  <h1 id="who">Check-in</h1>
  <p class="why" id="why"></p>
  <div class="msg" id="msg"></div>
  <a class="btn primary" id="send" href="#">Open text, already written</a>
  <button class="btn secondary" id="copy" type="button">Copy message</button>
  <p class="note">Edit anything you like before you send. Nothing goes out until you press send.</p>
</main>
<script>
  var p = new URLSearchParams(location.search);
  var name = p.get('n') || 'Check-in';
  var why = p.get('w') || '';
  var body = p.get('b') || '';
  var to = (p.get('to') || '').replace(/[^0-9+]/g, '');
  var email = p.get('e') || '';
  var subj = p.get('s') || '';
  document.title = name;
  document.getElementById('who').textContent = name;
  document.getElementById('why').textContent = why;
  document.getElementById('msg').textContent = body;
  var send = document.getElementById('send');
  if (email) {
    send.textContent = 'Open email, already written';
    send.href = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
  } else if (to) {
    var sep = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) ? '&' : '?';
    send.href = 'sms:' + to + sep + 'body=' + encodeURIComponent(body);
  } else {
    send.style.display = 'none';
    var w = document.getElementById('why');
    w.innerHTML = '';
    var s = document.createElement('span'); s.className = 'err';
    s.textContent = 'No phone number on file for this client. Copy the message and send it yourself.';
    w.appendChild(s);
  }
  document.getElementById('copy').addEventListener('click', function () {
    var b = this;
    function done() { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy message'; }, 1500); }
    if (navigator.clipboard) { navigator.clipboard.writeText(body).then(done, function () {}); }
  });
</script>
</body>
</html>

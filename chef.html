<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Production Sheet · EatsByATX</title>
<style>
  :root {
    --ink: #1f1d1a;
    --paper: #f7f4ed;
    --card: #fffdf8;
    --line: #e4ddcd;
    --sage: #5c6b54;
    --sage-deep: #44503e;
    --clay: #c2683f;
    --muted: #8a8475;
    --alert-bg: #fdf3e4;
    --alert-line: #e8c89a;
    --alert-ink: #8a5a1d;
    --rest-bg: #fbeae6;
    --rest-line: #e5b3a6;
    --rest-deep: #b54a32;
    --rest-ink: #7c3322;
    --ban-fill: #b3261e;
    --chip-bg: #f6dcd6;
    --door-bg: #eef3f9;
    --door-line: #c9d8e8;
    --door-ink: #24425f;
    --door-deep: #3f6d9c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    padding-bottom: calc(56px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 600px; margin: 0 auto; }

  header { padding: 26px 22px 18px; border-bottom: 1px solid var(--line); background: var(--card); }
  .brand { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--clay); font-weight: 700; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 25px; font-weight: 600; margin-top: 8px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 14.5px; margin-top: 6px; }
  .state-msg { margin: 40px 22px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.7; }

  .progress-bar { margin: 14px 22px 4px; height: 7px; background: #e8e2d4; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--sage); border-radius: 99px; transition: width 0.35s ease; }
  .progress-label { margin: 7px 22px 0; font-size: 13px; color: var(--muted); }

  .client-block { margin: 24px 0 0; }
  .client-head {
    background: var(--ink); color: var(--paper);
    margin: 0 16px; border-radius: 12px 12px 0 0;
    padding: 13px 16px; font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
  }
  .info-lines { background: var(--card); border: 1px solid var(--line); border-top: none; margin: 0 16px; padding: 12px 16px; font-size: 14.5px; }
  .info-lines .row { display: flex; gap: 8px; padding: 2px 0; }
  .info-lines .lbl { color: var(--muted); flex: 0 0 auto; }
  /* Door zone: address + access, what the chef needs to get in. Blue/neutral on purpose,
     so it never competes with the red/amber cooking warnings below it. */
  .door {
    background: var(--door-bg); border: 1px solid var(--door-line); border-top: none;
    border-left: 4px solid var(--door-deep);
    margin: 0 16px; padding: 10px 14px 11px; color: var(--door-ink); font-size: 14.5px;
  }
  .door-label { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: var(--door-deep); margin-bottom: 4px; }
  .door-row { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; line-height: 1.45; }
  .door-ico { flex: 0 0 auto; }
  .door-txt { min-width: 0; overflow-wrap: anywhere; }
  .door-addr { color: inherit; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(36,66,95,.4); text-underline-offset: 3px; }
  .door-access { font-weight: 700; }

  /* Restriction block. The pin (client name + allergy line) stays stuck to the top while
     scrolling within this client; the full restriction list sits in flow directly beneath it,
     never collapsed or scrolled, so a long list can't swallow the viewport when pinned. */
  .rest-pin { position: sticky; top: 0; z-index: 50; margin: 0 16px; }
  .rest-name {
    background: var(--ink); color: var(--paper);
    border-top: 1px solid rgba(247,244,237,.25);
    font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 5px 14px; overflow-wrap: anywhere;
  }
  .allergy { padding: 8px 14px; line-height: 1.4; overflow-wrap: anywhere; }
  .allergy.red { background: var(--ban-fill); color: #fff; font-size: 16px; font-weight: 800; padding: 12px 14px; }
  .allergy.warn { background: var(--alert-bg); color: var(--alert-ink); border-bottom: 2px solid var(--alert-line); font-size: 13.5px; font-weight: 700; }
  .allergy.ok { background: var(--card); color: var(--muted); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 600; padding: 5px 14px; }

  .rest-body {
    background: var(--card); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 12px 12px; margin: 0 16px; padding: 10px 12px 12px;
  }
  .rest-label { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: var(--rest-deep); margin: 2px 0 7px; }
  .rest-label.also { color: var(--muted); margin-top: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .chip {
    background: var(--chip-bg); color: var(--rest-ink);
    border-radius: 7px; padding: 4px 9px; font-size: 13.5px; font-weight: 700; line-height: 1.35;
    max-width: 100%; overflow-wrap: anywhere;
  }
  .rrows { display: flex; flex-direction: column; gap: 4px; }
  .rrow {
    border-left: 2px solid #cfc9b8; padding: 3px 10px;
    font-size: 14px; color: var(--ink); line-height: 1.45; overflow-wrap: anywhere;
  }
  .rest-empty { font-size: 13.5px; color: var(--muted); }

  .prefs {
    background: var(--alert-bg); border: 1px solid var(--alert-line); border-left: 4px solid #c98a2e;
    border-radius: 10px; padding: 11px 14px; margin: 12px 16px 0;
  }
  .prefs-label { font-size: 11.5px; font-weight: 800; letter-spacing: 0.13em; color: var(--alert-ink); margin-bottom: 5px; }
  .prefs-line { font-size: 14.5px; color: var(--alert-ink); padding: 2px 0; }

  /* Meal tabs */
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 14px 16px 4px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    background: var(--card); border: 1.5px solid var(--line);
    border-radius: 99px; padding: 9px 15px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 7px;
    max-width: 230px;
  }
  .tab .t-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .tab .t-check {
    width: 17px; height: 17px; border-radius: 99px;
    border: 1.5px solid #bcb6a4; flex: 0 0 auto;
    display: grid; place-items: center;
  }
  .tab .t-check svg { width: 10px; height: 10px; opacity: 0; }
  .tab.done .t-check { background: var(--sage); border-color: var(--sage); }
  .tab.done .t-check svg { opacity: 1; }
  .tab.done .t-label { text-decoration: line-through; text-decoration-color: #b6b0a0; opacity: 0.75; }

  /* Recipe panel */
  .panel { margin: 10px 16px 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px 20px; }
  .panel-title { font-family: Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }
  .mod {
    background: var(--alert-bg); border: 1px solid var(--alert-line); border-left: 4px solid #c98a2e;
    border-radius: 10px; padding: 11px 13px; margin-top: 13px;
  }
  .mod-label { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: var(--alert-ink); margin-bottom: 5px; }
  .mod-line { font-size: 14.5px; color: var(--alert-ink); padding: 2px 0; }
  .mod-line.caps { font-weight: 800; }

  .sec-label {
    font-size: 11.5px; font-weight: 800; letter-spacing: 0.15em; color: var(--muted);
    margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); color: var(--ink);
  }
  .sec-body { font-size: 15px; white-space: pre-wrap; line-height: 1.65; }
  .sec-body.notes { font-size: 14px; color: var(--sage-deep); }

  .recipe-link { display: inline-block; margin-top: 16px; font-size: 14px; color: var(--sage-deep); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  .done-btn {
    display: block; width: 100%;
    margin-top: 20px;
    background: var(--sage); color: #fff;
    border: none; border-radius: 12px;
    padding: 15px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .done-btn.undone-state { background: var(--card); color: var(--sage-deep); border: 1.5px solid var(--sage); }
  .done-btn:active { transform: translateY(1px); }

  .footer-note { margin: 28px 22px 0; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; }

  .savebar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 22px calc(10px + env(safe-area-inset-bottom));
    display: none; z-index: 60;
  }
  .savebar.visible { display: block; }
  .savebar .inner { max-width: 600px; margin: 0 auto; }
  .save-status { font-size: 13px; color: var(--sage); display: flex; align-items: center; gap: 7px; }
  .save-status.err { color: #a04428; }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: currentColor; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">EatsByATX</div>
    <h1>Chef production sheet</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="content"><div class="state-msg">Loading your production sheet&hellip;</div></div>
</div>

<div class="savebar" id="savebar">
  <div class="inner"><div class="save-status" id="savestatus"><span class="dot"></span><span id="savetxt">All changes saved</span></div></div>
</div>

<script>
  var GET_URL  = "https://hook.us2.make.com/mi8bxatsoobuv6s3jsb8jlcjwxfnkzms";
  var SAVE_URL = "https://hook.us2.make.com/yrfabtq44ucjv8yuc76v63nrupvfr2qh";

  var key = new URLSearchParams(location.search).get("key");
  var state = null;
  var dirty = false;
  var saveTimer = null;

  var content = document.getElementById("content");
  var meta = document.getElementById("meta");
  var savebar = document.getElementById("savebar");
  var savetxt = document.getElementById("savetxt");
  var savestatus = document.getElementById("savestatus");

  var CHECK = '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function showMessage(html) { content.innerHTML = '<div class="state-msg">' + html + '</div>'; }

  // Restriction entries at or under this length render as chips (hard bans are short: there is
  // nothing to qualify). Longer entries carry a condition and render as full-width neutral rows.
  var CHIP_MAX = 30;

  // restrictions is one entry per array element. Tolerate a bare string or blank entries.
  function restrictionList(raw) {
    var arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
    var out = [];
    arr.forEach(function (r) { var t = String(r == null ? "" : r).trim(); if (t) out.push(t); });
    return out;
  }

  // allergyLine is a single string starting with \uD83D\uDD34 (red), \u2713 (confirmed) or \u26A0 (warning).
  // Anything unrecognised is shown as-is at warning weight; a missing line is never treated as confirmed.
  function allergyTier(line) {
    var t = (line == null ? "" : String(line)).trim();
    if (!t) return "missing";
    if (t.indexOf("\uD83D\uDD34") === 0) return "red";
    if (t.charAt(0) === "\u2713") return "ok";
    return "warn";
  }

  function load() {
    if (!key) { showMessage("This link is missing its sheet code.<br>Please use the exact link you were sent."); return; }
    fetch(GET_URL + "?key=" + encodeURIComponent(key))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        if (!data || !data.sheet) throw new Error("empty");
        state = {
          chefName: data.chefName || "",
          serviceDay: data.serviceDay || "",
          sheet: typeof data.sheet === "string" ? JSON.parse(data.sheet) : data.sheet
        };
        render();
      })
      .catch(function () { showMessage("We couldn't load this sheet right now.<br>Give it a moment and refresh."); });
  }

  // Split a body string into sections by INGREDIENTS / STEPS / CHEF'S NOTES headers
  function splitBody(body) {
    var out = [];
    var pattern = /^(INGREDIENTS|STEPS|CHEF'S NOTES)\s*$/m;
    var parts = (body || "").split(/^(INGREDIENTS|STEPS|CHEF'S NOTES)\s*$/m);
    var current = null;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p === "INGREDIENTS" || p === "STEPS" || p === "CHEF'S NOTES") {
        current = { label: p, text: "" };
        out.push(current);
      } else if (p.trim()) {
        if (current) { current.text += p.trim(); }
        else { out.push({ label: null, text: p.trim() }); }
      }
    }
    return out.length ? out : [{ label: null, text: body || "" }];
  }

  function render() {
    meta.textContent = state.chefName + " \u00B7 Service day: " + state.serviceDay;
    var html = '';
    html += '<div class="progress-bar"><div class="progress-fill" id="fill"></div></div>';
    html += '<div class="progress-label" id="plabel"></div>';
    html += '<div id="blocks"></div>';
    html += '<div class="footer-note">Tap a meal tab to open its recipe \u00B7 Mark it cooked &amp; packed when done<br>Checkmarks save automatically.</div>';
    content.innerHTML = html;

    var blocks = document.getElementById("blocks");
    state.sheet.forEach(function (cb) {
      var block = document.createElement("div");
      block.className = "client-block";

      var head = document.createElement("div");
      head.className = "client-head";
      head.textContent = cb.client;
      block.appendChild(head);

      var clientShort = (cb.client || "").split("|")[0].trim();

      // Door zone: what the chef needs to get in. Everything below it is for the stove.
      if (cb.address || cb.access) {
        var door = document.createElement("div");
        door.className = "door";
        var dl = document.createElement("div"); dl.className = "door-label"; dl.textContent = "AT THE DOOR";
        door.appendChild(dl);
        if (cb.address) {
          var ar = document.createElement("div"); ar.className = "door-row";
          var ai = document.createElement("span"); ai.className = "door-ico"; ai.textContent = "\uD83D\uDCCD";
          var av = document.createElement("a");
          av.className = "door-txt door-addr";
          av.textContent = cb.address;
          av.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(cb.address);
          av.target = "_blank";
          av.rel = "noopener";
          ar.appendChild(ai); ar.appendChild(av); door.appendChild(ar);
        }
        if (cb.access) {
          var xr = document.createElement("div"); xr.className = "door-row";
          var xi = document.createElement("span"); xi.className = "door-ico"; xi.textContent = "\uD83D\uDD11";
          var xv = document.createElement("span"); xv.className = "door-txt door-access"; xv.textContent = cb.access;
          xr.appendChild(xi); xr.appendChild(xv); door.appendChild(xr);
        }
        block.appendChild(door);
      }

      if (cb.format || cb.spice || cb.organic) {
        var info = document.createElement("div");
        info.className = "info-lines";
        function row(lbl, val) {
          if (!val) return;
          var r = document.createElement("div"); r.className = "row";
          var l = document.createElement("span"); l.className = "lbl"; l.textContent = lbl;
          var v = document.createElement("span"); v.textContent = val;
          r.appendChild(l); r.appendChild(v); info.appendChild(r);
        }
        row("Format:", cb.format);
        row("Spice Tolerance:", cb.spice);
        row("Organic Priority:", cb.organic);
        block.appendChild(info);
      }

      // Restriction block. Pin = client name + allergy line, sticky while scrolling this client.
      var pin = document.createElement("div");
      pin.className = "rest-pin";
      var pn = document.createElement("div"); pn.className = "rest-name"; pn.textContent = clientShort;
      pin.appendChild(pn);
      var tier = allergyTier(cb.allergyLine);
      var al = document.createElement("div");
      al.className = "allergy " + (tier === "missing" ? "warn" : tier);
      al.textContent = tier === "missing" ? "\u26A0\uFE0F Allergies not confirmed" : String(cb.allergyLine).trim();
      pin.appendChild(al);
      block.appendChild(pin);

      // Every restriction renders, one element per entry: short ones as chips, long ones as rows.
      var body = document.createElement("div");
      body.className = "rest-body";
      var chips = [], rows = [];
      restrictionList(cb.restrictions).forEach(function (r) { (r.length <= CHIP_MAX ? chips : rows).push(r); });
      if (chips.length) {
        var cl = document.createElement("div"); cl.className = "rest-label"; cl.textContent = "\uD83D\uDEAB NEVER USE";
        body.appendChild(cl);
        var cw = document.createElement("div"); cw.className = "chips";
        chips.forEach(function (r) {
          var c = document.createElement("span"); c.className = "chip"; c.textContent = r; cw.appendChild(c);
        });
        body.appendChild(cw);
      }
      if (rows.length) {
        if (chips.length) {
          var rlbl = document.createElement("div"); rlbl.className = "rest-label also"; rlbl.textContent = "ALSO";
          body.appendChild(rlbl);
        }
        var rw = document.createElement("div"); rw.className = "rrows";
        rows.forEach(function (r) {
          var rr = document.createElement("div"); rr.className = "rrow"; rr.textContent = r; rw.appendChild(rr);
        });
        body.appendChild(rw);
      }
      if (!chips.length && !rows.length) {
        var em = document.createElement("div"); em.className = "rest-empty"; em.textContent = "No restrictions listed on this sheet";
        body.appendChild(em);
      }
      block.appendChild(body);

      if (cb.prefs && cb.prefs.length) {
        var prefs = document.createElement("div");
        prefs.className = "prefs";
        prefs.innerHTML = '<div class="prefs-label">\u26A0\uFE0F MODIFICATIONS & PREFERENCES</div>';
        cb.prefs.forEach(function (line) {
          var pl = document.createElement("div"); pl.className = "prefs-line"; pl.textContent = line;
          prefs.appendChild(pl);
        });
        block.appendChild(prefs);
      }

      // Meal tabs
      var tabs = document.createElement("div");
      tabs.className = "tabs";
      var panelHolder = document.createElement("div");
      var activeIdx = 0;
      var tabEls = [];

      function renderPanel(idx) {
        var m = cb.meals[idx];
        panelHolder.innerHTML = "";
        var panel = document.createElement("div");
        panel.className = "panel";

        var title = document.createElement("div");
        title.className = "panel-title";
        title.textContent = (idx + 1) + ". " + m.title;
        panel.appendChild(title);

        if (m.mod && m.mod.length) {
          var mod = document.createElement("div");
          mod.className = "mod";
          mod.innerHTML = '<div class="mod-label">MOD</div>';
          m.mod.forEach(function (line) {
            var ml = document.createElement("div");
            ml.className = "mod-line" + (line === line.toUpperCase() && /[A-Z]/.test(line) ? " caps" : "");
            ml.textContent = line;
            mod.appendChild(ml);
          });
          panel.appendChild(mod);
        }

        splitBody(m.body).forEach(function (sec) {
          if (sec.label) {
            var sl = document.createElement("div");
            sl.className = "sec-label";
            sl.textContent = sec.label;
            panel.appendChild(sl);
          }
          var sb = document.createElement("div");
          sb.className = "sec-body" + (sec.label === "CHEF'S NOTES" ? " notes" : "");
          sb.textContent = sec.text;
          panel.appendChild(sb);
        });

        if (m.recipeUrl) {
          var rl = document.createElement("a");
          rl.className = "recipe-link";
          rl.href = m.recipeUrl; rl.target = "_blank"; rl.rel = "noopener";
          rl.textContent = "Open recipe in Notion \u2197";
          panel.appendChild(rl);
        }

        var btn = document.createElement("button");
        function styleBtn() {
          if (m.done) { btn.className = "done-btn undone-state"; btn.textContent = "\u2713 Cooked & packed \u2014 tap to undo"; }
          else { btn.className = "done-btn"; btn.textContent = "Mark cooked & packed"; }
        }
        styleBtn();
        btn.addEventListener("click", function () {
          m.done = !m.done;
          styleBtn();
          tabEls[idx].classList.toggle("done", m.done);
          updateProgress();
          queueSave();
        });
        panel.appendChild(btn);
        panelHolder.appendChild(panel);
      }

      cb.meals.forEach(function (m, idx) {
        var tab = document.createElement("div");
        tab.className = "tab" + (m.done ? " done" : "") + (idx === 0 ? " active" : "");
        tab.innerHTML = '<span class="t-check">' + CHECK + '</span><span class="t-label">' + (idx + 1) + ". " + m.title.split(" with ")[0] + '</span>';
        tab.addEventListener("click", function () {
          tabEls.forEach(function (t) { t.classList.remove("active"); });
          tab.classList.add("active");
          activeIdx = idx;
          renderPanel(idx);
        });
        tabEls.push(tab);
        tabs.appendChild(tab);
      });

      block.appendChild(tabs);
      block.appendChild(panelHolder);
      renderPanel(0);
      blocks.appendChild(block);
    });

    savebar.classList.add("visible");
    updateProgress();
  }

  function counts() {
    var total = 0, done = 0;
    state.sheet.forEach(function (cb) { cb.meals.forEach(function (m) { total++; if (m.done) done++; }); });
    return { total: total, done: done };
  }
  function updateProgress() {
    var c = counts();
    var fill = document.getElementById("fill");
    var plabel = document.getElementById("plabel");
    if (fill) fill.style.width = (c.total ? (c.done / c.total * 100) : 0) + "%";
    if (plabel) plabel.textContent = c.done + " of " + c.total + " meals cooked & packed";
  }

  function queueSave() {
    dirty = true;
    savestatus.classList.remove("err");
    savetxt.textContent = "Saving\u2026";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 700);
  }
  function doSave() {
    var body = new URLSearchParams();
    body.set("key", key);
    body.set("chefName", state.chefName);
    body.set("serviceDay", state.serviceDay);
    body.set("sheet", JSON.stringify(state.sheet));
    fetch(SAVE_URL, { method: "POST", body: body })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); })
      .then(function () { dirty = false; savestatus.classList.remove("err"); savetxt.textContent = "All changes saved"; })
      .catch(function () {
        savestatus.classList.add("err");
        savetxt.textContent = "Couldn't save \u2014 retrying\u2026";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(doSave, 3000);
      });
  }

  load();
</script>
</body>
</html>

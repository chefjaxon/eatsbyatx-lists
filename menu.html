<!DOCTYPE html>
<!-- build 2026-07-05.7 : menu first, ratings below, unrated persists after submit -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Weekly Menu · EatsByATX</title>
<style>
  :root {
    --ink: #1f1d1a; --paper: #f7f4ed; --card: #fffdf8; --line: #e4ddcd;
    --sage: #5c6b54; --sage-deep: #44503e; --clay: #c2683f; --muted: #8a8475;
    --gold: #c99a3f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; padding-bottom: 96px; }
  .wrap { max-width: 540px; margin: 0 auto; }
  header { padding: 28px 22px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  .brand { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--clay); font-weight: 700; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 27px; font-weight: 600; margin-top: 8px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 14.5px; margin-top: 6px; }
  .state-msg { margin: 40px 22px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.7; }
  .instruct { margin: 18px 22px 6px; background: #eef0e8; border: 1px solid #d8ddcb; border-radius: 12px; padding: 13px 15px; font-size: 14.5px; color: var(--sage-deep); }

  .dish {
    margin: 14px 22px 0; background: var(--card);
    border: 1.5px solid var(--line); border-radius: 14px;
    padding: 16px; cursor: pointer; user-select: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .dish.sel { border-color: var(--sage); box-shadow: 0 0 0 1.5px var(--sage); }
  .dish-top { display: flex; gap: 13px; align-items: flex-start; }
  .box { flex: 0 0 25px; height: 25px; margin-top: 2px; border: 2px solid #bcb6a4; border-radius: 8px; display: grid; place-items: center; transition: background 0.15s, border-color 0.15s; }
  .box svg { width: 15px; height: 15px; opacity: 0; }
  .dish.sel .box { background: var(--sage); border-color: var(--sage); }
  .dish.sel .box svg { opacity: 1; }
  .dish-title { font-family: Georgia, serif; font-size: 17.5px; font-weight: 600; line-height: 1.35; }
  .dish-desc { font-size: 14px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .note-area { display: none; margin-top: 13px; }
  .dish.sel .note-area { display: block; }
  .note-area textarea {
    width: 100%; min-height: 54px; resize: vertical;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 14px;
    background: var(--paper); color: var(--ink);
  }
  .note-area textarea::placeholder { color: #b3ac9b; }

  .footer-note { margin: 26px 22px 0; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; }

  .submitbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 22px calc(12px + env(safe-area-inset-bottom));
    display: none; z-index: 60;
  }
  .submitbar.visible { display: block; }
  .submitbar .inner { max-width: 540px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .count { font-size: 14px; color: var(--muted); flex: 1; font-weight: 600; }
  .count.ready { color: var(--sage-deep); }
  .btn { background: var(--clay); color: #fff; border: none; border-radius: 12px; padding: 14px 24px; font-size: 15.5px; font-weight: 700; cursor: pointer; }
  .btn:disabled { background: #d8cfc0; cursor: default; }
  .btn:active:not(:disabled) { transform: translateY(1px); }

  .thanks { margin: 50px 22px; text-align: center; }
  .thanks .big { font-family: Georgia, serif; font-size: 24px; font-weight: 600; }
  .thanks p { color: var(--muted); font-size: 15px; margin-top: 10px; line-height: 1.7; }
  .editlink { display: inline-block; margin-top: 18px; color: var(--sage-deep); font-weight: 600; font-size: 14.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* ---- Section headers ---- */
  .sect-head { margin: 26px 22px 0; display: flex; align-items: baseline; gap: 10px; }
  .sect-head .t { font-family: Georgia, serif; font-size: 19px; font-weight: 600; }
  .sect-head .s { font-size: 13px; color: var(--muted); }

  /* ---- Rate last week ---- */
  .rate-wrap { margin: 0 22px; }
  .rate-card {
    margin-top: 12px; background: #fbf7ee; border: 1.5px solid #e8dfc8;
    border-radius: 14px; padding: 14px 16px;
  }
  .rate-card.done { background: var(--card); border-color: var(--line); }
  .rate-title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .rate-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .stars { display: flex; gap: 6px; margin-top: 10px; }
  .star { font-size: 27px; line-height: 1; color: #d8cfc0; cursor: pointer; background: none; border: none; padding: 2px 3px; }
  .star.on { color: var(--gold); }
  .stars.locked .star { cursor: default; }
  .rate-thanks { font-size: 13px; color: var(--sage-deep); font-weight: 600; margin-top: 8px; }
  .cmt-row { display: none; margin-top: 10px; gap: 8px; }
  .cmt-row.visible { display: flex; }
  .cmt-row input {
    flex: 1; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font: inherit; font-size: 13.5px; background: #fff; color: var(--ink);
  }
  .cmt-row button {
    background: var(--sage); color: #fff; border: none; border-radius: 10px;
    padding: 9px 14px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .rate-more { margin: 12px 22px 0; text-align: center; }
  .rate-more span { color: var(--sage-deep); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* ---- Have it again ---- */
  .hist-toggle {
    margin: 26px 22px 0; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 15px 16px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 12px;
  }
  .hist-toggle .ic { font-size: 20px; }
  .hist-toggle .tx { flex: 1; }
  .hist-toggle .tx b { font-family: Georgia, serif; font-size: 16.5px; font-weight: 600; display: block; }
  .hist-toggle .tx small { color: var(--muted); font-size: 13px; }
  .hist-toggle .chev { color: var(--muted); transition: transform 0.2s; }
  .hist-toggle.open .chev { transform: rotate(180deg); }
  .hist-body { display: none; }
  .hist-body.open { display: block; }
  .hist-search { margin: 12px 22px 0; }
  .hist-search input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 14px; font: inherit; font-size: 14.5px; background: var(--card); color: var(--ink);
  }
  .hist-search input::placeholder { color: #b3ac9b; }
  .hist-card {
    margin: 12px 22px 0; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 14px 16px;
  }
  .hist-card.requested { border-color: var(--clay); box-shadow: 0 0 0 1px var(--clay); }
  .hist-title { font-family: Georgia, serif; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .hist-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .hist-meta .rated { color: var(--gold); letter-spacing: 1px; }
  .hist-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .pill {
    border: 1.5px solid var(--clay); color: var(--clay); background: none;
    border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .pill.on { background: var(--clay); color: #fff; }
  .mini-stars { display: flex; gap: 3px; }
  .mini-stars .star { font-size: 21px; padding: 1px 2px; }
  .hist-more { margin: 14px 22px 0; text-align: center; }
  .hist-more span { color: var(--sage-deep); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .hist-empty { margin: 16px 22px 0; text-align: center; color: var(--muted); font-size: 14px; }

  .half-chip {
    display: inline-block; vertical-align: 2px; margin-left: 8px;
    background: #efe7d4; color: #8a6d3b; border-radius: 999px;
    padding: 2px 9px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
    font-family: ui-sans-serif, -apple-system, sans-serif;
  }
  .svc-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .svc-row .lbl { font-size: 14.5px; font-weight: 600; }
  .svc-send { margin-top: 12px; width: 100%; background: var(--sage); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .svc-send:disabled { background: #d8cfc0; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">EatsByATX</div>
    <h1>Your weekly menu</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div id="content"><div class="state-msg">Loading your menu&hellip;</div></div>
  <div id="ratezone"></div>
  <div id="histzone"></div>
</div>

<div class="submitbar" id="submitbar">
  <div class="inner">
    <div class="count" id="count"></div>
    <button class="btn" id="submitbtn" disabled>Submit selections</button>
  </div>
</div>

<script>
  var GET_URL    = "https://hook.us2.make.com/tay2tjv1singwv4o9svq6qf1ydwpspqi";
  var SAVE_URL   = "https://hook.us2.make.com/ucaq72jw7ofxkpyvy19455s6cylht5n9";
  var HIST_URL   = "https://hook.us2.make.com/59ga33b1tlg4y4ce1hvcrskh816yg22r";
  var UPDATE_URL = "https://hook.us2.make.com/1jnlhrkbemq50cfaq583uxsy1pmrtbo3";
  var SVC_URL    = "https://hook.us2.make.com/2fb2yxqkisgwcwdjavuuim3ncbv00tmk";

  var key = new URLSearchParams(location.search).get("key");
  var state = null;   // { clientName, weekLabel, pickCount, status, menu: [{title, desc, selected, note}] }
  var dishHistory = [];   // parsed dish-history rows from Notion (NOTE: never name this "history" — window.history is read-only)
  var RATE_PROMPT_LIMIT = 8;

  var content = document.getElementById("content");
  var ratezone = document.getElementById("ratezone");
  var histzone = document.getElementById("histzone");
  var meta = document.getElementById("meta");
  var submitbar = document.getElementById("submitbar");
  var countEl = document.getElementById("count");
  var submitbtn = document.getElementById("submitbtn");

  var CHECK = '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function showMessage(html) { content.innerHTML = '<div class="state-msg">' + html + '</div>'; submitbar.classList.remove("visible"); }

  /* ================= CORE LOGIC (pure helpers) ================= */

  // Properties can arrive in two shapes: keyed object (raw Notion API)
  // or array of {label, type, ...} objects (Make's Notion module). Support both.
  function propGet(page, name) {
    try {
      if (Array.isArray(page.properties)) {
        for (var i = 0; i < page.properties.length; i++) {
          if (page.properties[i].label === name) return page.properties[i];
        }
        return null;
      }
      return page.properties[name] || null;
    } catch (e) { return null; }
  }

  function propText(page, name) {
    try {
      var p = propGet(page, name);
      if (!p) return "";
      var arr = p.rich_text || p.title || p.text;
      if (!arr || !arr.length) return "";
      var out = "";
      for (var i = 0; i < arr.length; i++) {
        var it = arr[i];
        out += (it.plain_text != null ? it.plain_text : (it.text && it.text.content) || "");
      }
      return out;
    } catch (e) { return ""; }
  }

  function parseHistory(apiBody) {
    var rows = [];
    if (!apiBody || !apiBody.results) return rows;
    for (var i = 0; i < apiBody.results.length; i++) {
      var pg = apiBody.results[i];
      if (!pg || !pg.properties) continue;
      var ratingProp = propGet(pg, "Rating");
      var selProp = propGet(pg, "Selected");
      var weekProp = propGet(pg, "Week");
      var reqProp = propGet(pg, "Requested Again");
      var halfProp = propGet(pg, "Half Meal");
      rows.push({
        id: (pg.id || "").replace(/-/g, ""),
        clientName: propText(pg, "Client Name"),
        half: !!(halfProp && halfProp.checkbox),
        title: propText(pg, "Dish"),
        desc: propText(pg, "Description"),
        note: propText(pg, "Client Note"),
        ratingComment: propText(pg, "Rating Comment"),
        weekLabel: propText(pg, "Week Label"),
        week: (weekProp && weekProp.date && weekProp.date.start) ? weekProp.date.start : "",
        selected: !!(selProp && selProp.checkbox),
        rating: (ratingProp && typeof ratingProp.number === "number") ? ratingProp.number : 0,
        requested: !!(reqProp && reqProp.date && reqProp.date.start)
      });
    }
    // Most recent week first (webhook order is not guaranteed)
    rows.sort(function (x, y) { return (y.week || "").localeCompare(x.week || ""); });
    return rows;
  }

  // Dishes eligible for the "rate last week" prompt: received (selected),
  // unrated, and not from the week currently open on this page.
  function pickUnrated(rows, currentWeekLabel) {
    var out = [], seen = {}, rated = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.title && r.rating > 0) rated[r.title.toLowerCase()] = true;
    }
    for (var j = 0; j < rows.length; j++) {
      var row = rows[j];
      if (!row.selected || row.rating > 0 || !row.title) continue;
      if (currentWeekLabel && row.weekLabel && row.weekLabel.indexOf(currentWeekLabel) === 0) continue;
      if (currentWeekLabel && row.weekLabel && currentWeekLabel.indexOf(row.weekLabel) === 0) continue;
      var k = row.title.toLowerCase();
      if (seen[k] || rated[k]) continue; // one prompt per dish; skip if rated in any week
      seen[k] = true;
      out.push(row);
    }
    // rows arrive sorted by Week desc from the webhook; keep that order
    return out;
  }

  // Past dishes for the "have it again" browser: received dishes only,
  // deduped by title (most recent kept), excluding the current week.
  function dedupHistory(rows, currentWeekLabel) {
    var seen = {}, out = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r.selected || !r.title) continue;
      if (currentWeekLabel && r.weekLabel && r.weekLabel.indexOf(currentWeekLabel) === 0) continue;
      var k = r.title.toLowerCase();
      if (seen[k]) continue;
      seen[k] = true;
      out.push(r);
    }
    return out;
  }

  /* ================= NETWORK ================= */

  function postUpdate(row, fields) {
    var body = new URLSearchParams();
    body.set("pageId", row.id);
    body.set("dish", row.title || "");
    body.set("client", (state && state.clientName) || "");
    if (fields.rating) {
      body.set("rating", String(fields.rating));
      body.set("comment", fields.comment || "");
    }
    return fetch(UPDATE_URL, { method: "POST", body: body })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); });
  }

  function loadHistory() {
    if (!state || !state.clientName) return;
    fetch(HIST_URL + "?client=" + encodeURIComponent(state.clientName))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        // Defense in depth: only keep rows that belong to this client,
        // even though the webhook already filters by client name.
        dishHistory = parseHistory(data).filter(function (r) { return r.clientName === state.clientName; });
        renderRatePrompt();
        renderHistorySection();
      })
      .catch(function () { /* history is a bonus — the menu must never break because of it */ });
  }

  function load() {
    if (!key) { showMessage("This link is missing its menu code.<br>Please use the exact link we texted you, or reach out and we'll resend it."); return; }
    fetch(GET_URL + "?key=" + encodeURIComponent(key))
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        if (!data || !data.menu) throw new Error("empty");
        state = {
          clientName: data.clientName || "",
          weekLabel: data.weekLabel || "",
          pickCount: parseInt(data.pickCount, 10) || 0,
          status: data.status || "pending",
          menu: typeof data.menu === "string" ? JSON.parse(data.menu) : data.menu
        };
        if (state.status === "submitted") { renderThanks(true); } else { renderMenu(); }
        loadHistory();
      })
      .catch(function () { showMessage("We couldn't load your menu right now.<br>Give it a moment and refresh — or text us and we'll sort it out."); });
  }

  /* ================= RATE LAST WEEK ================= */

  // Stars are always editable — tapping a new value re-saves over the old one.
  function starRow(row, mini, onRated) {
    var wrapEl = document.createElement("div");
    wrapEl.className = "stars" + (mini ? " mini-stars" : "");
    var busy = false;
    var btns = [];
    function paint(n) { for (var i = 0; i < 5; i++) btns[i].classList.toggle("on", i < n); }
    for (var i = 1; i <= 5; i++) {
      (function (n) {
        var b = document.createElement("button");
        b.className = "star"; b.type = "button"; b.textContent = "★";
        b.setAttribute("aria-label", n + " star" + (n > 1 ? "s" : ""));
        b.addEventListener("click", function (e) {
          e.stopPropagation();
          if (busy || row.rating === n) return;
          busy = true;
          paint(n);
          postUpdate(row, { rating: n, comment: row.ratingComment || "" })
            .then(function () { row.rating = n; busy = false; if (onRated) onRated(n); })
            .catch(function () { busy = false; paint(row.rating || 0); });
        });
        btns.push(b); wrapEl.appendChild(b);
      })(i);
    }
    paint(row.rating || 0);
    return wrapEl;
  }

  function renderRatePrompt() {
    ratezone.innerHTML = "";
    var unrated = pickUnrated(dishHistory, state ? state.weekLabel : "");
    if (!unrated.length) return;

    var latestWeek = unrated[0].weekLabel;
    var batch = [];
    for (var i = 0; i < unrated.length; i++) if (unrated[i].weekLabel === latestWeek) batch.push(unrated[i]);
    var rest = unrated.length - batch.length;
    if (batch.length > RATE_PROMPT_LIMIT) batch = batch.slice(0, RATE_PROMPT_LIMIT);

    var head = document.createElement("div");
    head.className = "sect-head";
    head.innerHTML = '<span class="t">How were your meals?</span><span class="s">' + esc(latestWeek) + '</span>';
    ratezone.appendChild(head);

    var wrapEl = document.createElement("div");
    wrapEl.className = "rate-wrap";
    batch.forEach(function (row) { wrapEl.appendChild(rateCard(row)); });
    ratezone.appendChild(wrapEl);

    if (rest > 0 && state && state.status !== "submitted") {
      var more = document.createElement("div");
      more.className = "rate-more";
      more.innerHTML = '<span>You have ' + rest + ' more unrated meal' + (rest > 1 ? 's' : '') + ' — find them in "Have it again" below</span>';
      more.querySelector("span").addEventListener("click", openHistory);
      ratezone.appendChild(more);
    }

    ratezone.appendChild(svcCard(latestWeek));
  }

  // Small star row that just reports its value (no network until Send)
  function localStars(onSet) {
    var wrapEl = document.createElement("div");
    wrapEl.className = "stars mini-stars";
    var val = 0, btns = [];
    function paint(n) { for (var i = 0; i < 5; i++) btns[i].classList.toggle("on", i < n); }
    for (var i = 1; i <= 5; i++) {
      (function (n) {
        var b = document.createElement("button");
        b.className = "star"; b.type = "button"; b.textContent = "★";
        b.addEventListener("click", function () { val = n; paint(n); if (onSet) onSet(n); });
        btns.push(b); wrapEl.appendChild(b);
      })(i);
    }
    return { el: wrapEl, get: function () { return val; } };
  }

  function svcCard(weekLabelForCard) {
    var card = document.createElement("div");
    card.className = "rate-card";
    card.style.marginLeft = "22px"; card.style.marginRight = "22px";

    var t = document.createElement("div"); t.className = "rate-title"; t.textContent = "How was the service overall?";
    card.appendChild(t);
    var s = document.createElement("div"); s.className = "rate-sub"; s.textContent = "Totally optional — takes ten seconds";
    card.appendChild(s);

    var parts = [["Food", "food"], ["Ingredient quality", "ingredients"], ["Cleanup", "cleanup"], ["Your chef", "chef"]];
    var widgets = {};
    parts.forEach(function (p) {
      var rowEl = document.createElement("div");
      rowEl.className = "svc-row";
      var lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = p[0];
      var st = localStars(null);
      widgets[p[1]] = st;
      rowEl.appendChild(lbl); rowEl.appendChild(st.el);
      card.appendChild(rowEl);
    });

    var inp = document.createElement("input");
    inp.placeholder = "Anything else about the service? (optional)";
    inp.style.cssText = "width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink);";
    card.appendChild(inp);

    var send = document.createElement("button");
    send.type = "button"; send.className = "svc-send"; send.textContent = "Send service rating";
    send.addEventListener("click", function () {
      var anySet = ["food", "ingredients", "cleanup", "chef"].some(function (k) { return widgets[k].get() > 0; });
      if (!anySet && !inp.value.trim()) return;
      send.disabled = true; send.textContent = "Sending…";
      var body = new URLSearchParams();
      body.set("client", state.clientName);
      body.set("weekLabel", weekLabelForCard || state.weekLabel);
      ["food", "ingredients", "cleanup", "chef"].forEach(function (k) {
        if (widgets[k].get() > 0) body.set(k, String(widgets[k].get()));
      });
      body.set("comment", inp.value.trim());
      fetch(SVC_URL, { method: "POST", body: body })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); })
        .then(function () {
          card.classList.add("done");
          card.innerHTML = '<div class="rate-title">Thank you!</div><div class="rate-sub">Your service rating is in — we read every one.</div>';
        })
        .catch(function () { send.disabled = false; send.textContent = "Try again"; });
    });
    card.appendChild(send);

    return card;
  }

  function rateCard(row) {
    var card = document.createElement("div");
    card.className = "rate-card";

    var t = document.createElement("div"); t.className = "rate-title"; t.textContent = row.title;
    card.appendChild(t);
    var s = document.createElement("div"); s.className = "rate-sub"; s.textContent = "Tap to rate — it helps us build your future menus";
    card.appendChild(s);

    var cmtRow = document.createElement("div");
    cmtRow.className = "cmt-row";
    var inp = document.createElement("input");
    inp.placeholder = "Anything we should know? (optional)";
    var sendBtn = document.createElement("button");
    sendBtn.type = "button"; sendBtn.textContent = "Send";
    cmtRow.appendChild(inp); cmtRow.appendChild(sendBtn);

    var thanks = document.createElement("div");
    thanks.className = "rate-thanks";
    var rated = false;

    card.appendChild(starRow(row, false, function (n) {
      thanks.textContent = "Saved — tap the stars again if you want to change it.";
      if (rated) return;
      rated = true;
      card.classList.add("done");
      s.style.display = "none";
      card.appendChild(thanks);
      cmtRow.classList.add("visible");
      card.appendChild(cmtRow);
    }));

    sendBtn.addEventListener("click", function () {
      var c = inp.value.trim();
      if (!c) { cmtRow.classList.remove("visible"); return; }
      sendBtn.disabled = true; sendBtn.textContent = "…";
      postUpdate(row, { rating: row.rating, comment: c })
        .then(function () { row.ratingComment = c; cmtRow.classList.remove("visible"); thanks.textContent = "Thank you! Note saved."; })
        .catch(function () { sendBtn.disabled = false; sendBtn.textContent = "Send"; });
    });

    return card;
  }

  /* ================= HAVE IT AGAIN ================= */

  var histOpen = false, histShown = 20, histQuery = "";

  function openHistory() {
    histOpen = true;
    renderHistorySection();
    var el = document.getElementById("histtoggle");
    if (el) el.scrollIntoView({ behavior: "smooth" });
  }

  function renderHistorySection() {
    histzone.innerHTML = "";
    if (!state || state.status === "submitted") return;
    var all = dedupHistory(dishHistory, state ? state.weekLabel : "");
    if (!all.length) return;

    var tog = document.createElement("div");
    tog.className = "hist-toggle" + (histOpen ? " open" : "");
    tog.id = "histtoggle";
    tog.innerHTML = '<span class="ic">🍽️</span><span class="tx"><b>Have it again</b><small>' + all.length + ' dishes you’ve had before — tap to add one to this week</small></span><span class="chev">▼</span>';
    tog.addEventListener("click", function () { histOpen = !histOpen; renderHistorySection(); });
    histzone.appendChild(tog);

    if (!histOpen) return;

    var body = document.createElement("div");
    body.className = "hist-body open";

    var search = document.createElement("div");
    search.className = "hist-search";
    var sInp = document.createElement("input");
    sInp.placeholder = "Search your past dishes…";
    sInp.value = histQuery;
    sInp.addEventListener("input", function () { histQuery = sInp.value; drawList(); });
    search.appendChild(sInp);
    body.appendChild(search);

    var listEl = document.createElement("div");
    body.appendChild(listEl);
    var moreEl = document.createElement("div");
    moreEl.className = "hist-more";
    body.appendChild(moreEl);

    function drawList() {
      listEl.innerHTML = ""; moreEl.innerHTML = "";
      var q = histQuery.trim().toLowerCase();
      var rows = [];
      for (var i = 0; i < all.length; i++) {
        if (!q || all[i].title.toLowerCase().indexOf(q) !== -1) rows.push(all[i]);
      }
      // Favorites first: 4-5 star dishes on top, then the rest, each newest first
      rows.sort(function (x, y) {
        var xf = (x.rating >= 4) ? 1 : 0, yf = (y.rating >= 4) ? 1 : 0;
        if (xf !== yf) return yf - xf;
        if ((x.rating || 0) !== (y.rating || 0)) return (y.rating || 0) - (x.rating || 0);
        return (y.week || "").localeCompare(x.week || "");
      });
      if (!rows.length) {
        listEl.innerHTML = '<div class="hist-empty">No past dishes match that search.</div>';
        return;
      }
      var show = rows.slice(0, histShown);
      show.forEach(function (row) { listEl.appendChild(histCard(row)); });
      if (rows.length > show.length) {
        var m = document.createElement("span");
        m.textContent = "Show " + (rows.length - show.length) + " more";
        m.addEventListener("click", function () { histShown += 20; drawList(); });
        moreEl.appendChild(m);
      }
    }
    drawList();
    histzone.appendChild(body);
  }

  // Find this dish in the current selection (added from history as a repeat)
  function findRepeat(title) {
    for (var i = 0; i < state.menu.length; i++) {
      if (state.menu[i].repeat && state.menu[i].title === title) return state.menu[i];
    }
    return null;
  }

  // History cards work exactly like menu dishes: tap to select for THIS week.
  function histCard(row) {
    var existing = findRepeat(row.title);
    var isSel = !!(existing && existing.selected);

    var card = document.createElement("div");
    card.className = "hist-card" + (isSel ? " requested" : "");

    var top = document.createElement("div");
    top.className = "dish-top";
    var box = document.createElement("div"); box.className = "box"; box.innerHTML = CHECK;
    if (isSel) box.style.background = "var(--clay)", box.style.borderColor = "var(--clay)", box.querySelector("svg").style.opacity = "1";
    var txt = document.createElement("div");
    var t = document.createElement("div"); t.className = "hist-title"; t.textContent = row.title;
    if (row.half) { var hc = document.createElement("span"); hc.className = "half-chip"; hc.textContent = "½ meal"; t.appendChild(hc); }
    txt.appendChild(t);
    if (row.desc) { var dEl = document.createElement("div"); dEl.className = "dish-desc"; dEl.textContent = row.desc; txt.appendChild(dEl); }
    var metaEl = document.createElement("div");
    metaEl.className = "hist-meta";
    metaEl.textContent = "You had this " + (row.weekLabel ? row.weekLabel.toLowerCase().replace("week of", "the week of") : "before");
    txt.appendChild(metaEl);
    top.appendChild(box); top.appendChild(txt);
    card.appendChild(top);

    var act = document.createElement("div");
    act.className = "hist-actions";
    act.appendChild(starRow(row, true, function () { /* rated from history */ }));
    card.appendChild(act);

    var na = document.createElement("div");
    na.className = "note-area";
    na.style.display = isSel ? "block" : "none";
    var ta = document.createElement("textarea");
    ta.placeholder = "Any notes or requests for this dish? (optional)";
    // Pre-fill with the note they left the last time they had this dish (still editable)
    ta.value = (existing && existing.note) || row.note || "";
    ta.addEventListener("input", function () { var it = findRepeat(row.title); if (it) it.note = ta.value; });
    ta.addEventListener("click", function (e) { e.stopPropagation(); });
    na.appendChild(ta);
    card.appendChild(na);

    card.addEventListener("click", function () {
      var it = findRepeat(row.title);
      if (it && it.selected) {
        state.menu.splice(state.menu.indexOf(it), 1);
        card.classList.remove("requested");
        box.style.background = ""; box.style.borderColor = ""; box.querySelector("svg").style.opacity = "0";
        na.style.display = "none";
      } else {
        state.menu.push({ title: row.title, desc: row.desc || "", selected: true, note: ta.value || "", repeat: true, half: !!row.half });
        card.classList.add("requested");
        box.style.background = "var(--clay)"; box.style.borderColor = "var(--clay)"; box.querySelector("svg").style.opacity = "1";
        na.style.display = "block";
      }
      updateBar();
    });

    return card;
  }

  /* ================= MENU (unchanged flow) ================= */

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Snacks and simple salads count as half a meal (two snacks = one meal).
  function selUnits() {
    var n = 0; state.menu.forEach(function (d) { if (d.selected) n += (d.half ? 0.5 : 1); });
    return n;
  }

  function fmtUnits(n) {
    return (n % 1 === 0) ? String(n) : String(Math.floor(n)) + "½";
  }

  function updateBar() {
    var n = selUnits();
    var target = state.pickCount;
    if (target > 0) {
      countEl.textContent = fmtUnits(n) + " selected · package includes " + target;
    } else {
      countEl.textContent = fmtUnits(n) + " selected";
    }
    countEl.classList.toggle("ready", n > 0);
    submitbtn.disabled = (n === 0);
  }

  function renderMenu() {
    meta.textContent = state.clientName + " · " + state.weekLabel;
    var pkgText = state.pickCount > 0 ? " Your package includes " + state.pickCount + " meals this week, but feel free to select more if you’d like extras." : "";
    var html = '';
    html += '<div class="instruct"><b>Pick your meals</b> by tapping the dishes you want.' + pkgText + ' Add a note under any dish if there’s something you’d like adjusted or a question for us. Then hit submit — that’s it.</div>';
    html += '<div id="dishes"></div>';
    html += '<div class="footer-note">Questions? Text us anytime — we’re happy to help.</div>';
    content.innerHTML = html;

    var dishes = document.getElementById("dishes");
    state.menu.forEach(function (d) {
      if (d.repeat) return; // repeats live in the "Have it again" section
      var card = document.createElement("div");
      card.className = "dish" + (d.selected ? " sel" : "");

      var top = document.createElement("div");
      top.className = "dish-top";
      var box = document.createElement("div"); box.className = "box"; box.innerHTML = CHECK;
      var txt = document.createElement("div");
      var t = document.createElement("div"); t.className = "dish-title"; t.textContent = d.title;
      if (d.half) { var hc = document.createElement("span"); hc.className = "half-chip"; hc.textContent = "½ meal"; t.appendChild(hc); }
      txt.appendChild(t);
      if (d.desc) { var ds = document.createElement("div"); ds.className = "dish-desc"; ds.textContent = d.desc; txt.appendChild(ds); }
      top.appendChild(box); top.appendChild(txt);
      card.appendChild(top);

      var na = document.createElement("div");
      na.className = "note-area";
      var ta = document.createElement("textarea");
      ta.placeholder = "Any notes or requests for this dish? (optional)";
      ta.value = d.note || "";
      ta.addEventListener("input", function () { d.note = ta.value; });
      ta.addEventListener("click", function (e) { e.stopPropagation(); });
      na.appendChild(ta);
      card.appendChild(na);

      card.addEventListener("click", function () {
        d.selected = !d.selected;
        card.classList.toggle("sel", d.selected);
        updateBar();
      });

      dishes.appendChild(card);
    });

    submitbar.classList.add("visible");
    updateBar();
  }

  function renderThanks(existing) {
    submitbar.classList.remove("visible");
    meta.textContent = state.clientName + " · " + state.weekLabel;
    var picks = state.menu.filter(function (d) { return d.selected; });
    var html = '<div class="thanks">';
    html += '<div class="big">' + (existing ? "Your selections are in" : "Got it — thank you!") + '</div>';
    html += '<p>You picked:<br><b>' + picks.map(function (d) { return esc(d.title.split(" with ")[0]); }).join("<br>") + '</b></p>';
    html += '<p>We’ll take it from here. Your grocery checklist will be on its way before your service day.</p>';
    html += '<span class="editlink" id="editlink">Need to change something? Edit selections</span>';
    html += '</div>';
    content.innerHTML = html;
    document.getElementById("editlink").addEventListener("click", function () {
      state.status = "pending";
      renderMenu();
      renderRatePrompt();
      renderHistorySection();
    });
  }

  submitbtn.addEventListener("click", function () {
    var units = selUnits();
    if (state.pickCount > 0 && units < state.pickCount) {
      var ok = window.confirm("You’ve picked " + fmtUnits(units) + " so far, and your package includes " + state.pickCount + " meals. Submit anyway?");
      if (!ok) return;
    }
    submitbtn.disabled = true;
    submitbtn.textContent = "Submitting…";
    var body = new URLSearchParams();
    body.set("key", key);
    body.set("clientName", state.clientName);
    body.set("weekLabel", state.weekLabel);
    body.set("pickCount", String(state.pickCount));
    body.set("status", "submitted");
    body.set("menu", JSON.stringify(state.menu));
    fetch(SAVE_URL, { method: "POST", body: body })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); })
      .then(function () {
        state.status = "submitted";
        submitbtn.textContent = "Submit selections";
        histzone.innerHTML = "";
        renderThanks(false);
        renderRatePrompt(); // unrated meals stay available below the confirmation
        window.scrollTo(0, 0);
      })
      .catch(function () {
        submitbtn.disabled = false;
        submitbtn.textContent = "Try again";
      });
  });

  load();
</script>
</body>
</html>

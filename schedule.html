<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Eats by ATX — Chef Schedule</title>
<style>
  :root{
    --green:#1f3d2b;
    --green-deep:#152b1e;
    --cream:#faf7f0;
    --card:#ffffff;
    --ink:#22271f;
    --muted:#6f7a6a;
    --line:#e6e1d4;
    --accent:#c96f3b;
    --accent-soft:#f6e8dd;
    --ready:#2e7d4f;
    --ready-soft:#e4f1e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  header{
    background:var(--green);
    color:#f4f1e6;
    padding:20px 18px 18px;
  }
  .brand{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    opacity:.75;
  }
  h1{
    font-size:24px;
    font-weight:700;
    margin-top:4px;
    letter-spacing:-.01em;
  }
  .weekline{
    margin-top:6px;
    font-size:13px;
    opacity:.85;
  }
  main{max-width:560px;margin:0 auto;padding:16px 14px}
  .day{margin-top:22px}
  .day:first-child{margin-top:8px}
  .dayhead{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:0 4px 8px;
    border-bottom:2px solid var(--green);
  }
  .dayname{font-size:16px;font-weight:700;color:var(--green-deep)}
  .daydate{font-size:13px;color:var(--muted)}
  .todaytag{
    margin-left:auto;
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 8px;
    border-radius:99px;
  }
  .cook{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px 12px;
    margin-top:10px;
    box-shadow:0 1px 2px rgba(31,61,43,.05);
  }
  .cook.past{opacity:.55}
  .cookrow{display:flex;align-items:center;gap:10px}
  .client{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .meals{
    margin-left:auto;
    font-size:12px;
    font-weight:600;
    color:var(--green);
    background:#edf2ec;
    border:1px solid #d8e2d6;
    padding:3px 9px;
    border-radius:99px;
    white-space:nowrap;
  }
  .window{font-size:13px;color:var(--muted);margin-top:3px}
  .notes{
    margin-top:8px;
    font-size:13px;
    color:var(--ink);
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    padding:7px 10px;
    border-radius:0 8px 8px 0;
  }
  .links{display:flex;gap:8px;margin-top:12px}
  .links a,.links span{
    flex:1;
    text-align:center;
    font-size:13px;
    font-weight:600;
    padding:10px 6px;
    border-radius:9px;
    text-decoration:none;
  }
  .links a{
    color:#fff;
    background:var(--green);
  }
  .links a.sheet{background:var(--green-deep)}
  .links a:active{opacity:.85}
  .links span.pending{
    color:var(--muted);
    background:#efece2;
    border:1px dashed var(--line);
    font-weight:500;
  }
  .statusnote{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:26px;
  }
  .empty,.error,.picker{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:28px 18px;
    text-align:center;
    margin-top:24px;
  }
  .empty h2,.error h2,.picker h2{font-size:17px;margin-bottom:6px;color:var(--green-deep)}
  .empty p,.error p,.picker p{font-size:14px;color:var(--muted)}
  .picker a{
    display:block;
    margin-top:10px;
    padding:12px;
    border-radius:9px;
    background:var(--green);
    color:#fff;
    font-weight:600;
    text-decoration:none;
  }
  .error button{
    margin-top:14px;
    padding:10px 22px;
    border-radius:9px;
    border:0;
    background:var(--green);
    color:#fff;
    font-size:14px;
    font-weight:600;
  }
  .loading{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:40px 0;
  }
  @media (prefers-reduced-motion: no-preference){
    .cook{animation:rise .25s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<header>
  <div class="brand">Eats by ATX</div>
  <h1 id="title">Chef Schedule</h1>
  <div class="weekline" id="weekline">Loading your week…</div>
</header>
<main id="content"><div class="loading">Loading your week…</div></main>

<script>
  var FEED_URL = "https://hook.us2.make.com/si0au8tgp34cu9z78uths7jnyd5jpr9q";
  var CHEF_NAMES = { ashlee:"Ashlee", jhonny:"Jhonny", sam:"Sam" };
  var POLL_MS = 300000;

  var params = new URLSearchParams(location.search);
  var chef = (params.get("chef") || "").toLowerCase().trim();
  var PREVIEW = params.get("preview") === "1";
  var content = document.getElementById("content");
  var titleEl = document.getElementById("title");
  var weekEl = document.getElementById("weekline");
  var pollTimer = null;

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" +
      String(d.getDate()).padStart(2,"0");
  }

  function prettyDate(iso){
    var p = iso.split("-");
    var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    return months[d.getMonth()] + " " + d.getDate();
  }

  function renderPicker(){
    titleEl.textContent = "Chef Schedule";
    weekEl.textContent = "Eats by ATX team schedules";
    content.innerHTML =
      '<div class="picker"><h2>Whose schedule?</h2>' +
      '<p>Bookmark your own link — it updates every week automatically.</p>' +
      '<a href="?chef=ashlee">Ashlee</a>' +
      '<a href="?chef=jhonny">Jhonny</a>' +
      '<a href="?chef=sam">Sam</a></div>';
  }

  function renderError(){
    content.innerHTML =
      '<div class="error"><h2>Couldn\u2019t load the schedule</h2>' +
      '<p>Check your connection, then try again.</p>' +
      '<button onclick="load()">Reload</button></div>';
  }

  function render(records){
    var today = todayStr();
    var now = new Date();
    var curWeekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
    var nextWeekStart = new Date(curWeekStart.getTime() + 7*86400000);
    var weekAfterStart = new Date(curWeekStart.getTime() + 14*86400000);
    // Next week unlocks Friday 3:00 PM of the current week
    var unlockAt = new Date(curWeekStart.getTime() + 5*86400000 + 15*3600000);
    var nextWeekVisible = PREVIEW || now >= unlockAt;
    var keep = records.filter(function(r){
      if (!r.date) return false;
      var p = r.date.split("-");
      var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      var cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 2);
      if (d < cutoff) return false;
      if (d < nextWeekStart) return true;
      if (d < weekAfterStart) return nextWeekVisible;
      return false;
    });

    keep.sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      var sa = a.slot === "AM" ? 0 : 1, sb = b.slot === "AM" ? 0 : 1;
      return sa - sb;
    });

    if (!keep.length){
      content.innerHTML =
        '<div class="empty"><h2>Nothing scheduled yet</h2>' +
        '<p>Next week\u2019s schedule drops Friday at 3:00 PM. Check back then!</p></div>';
      weekEl.textContent = "New schedules drop Fridays at 3 PM";
      return;
    }

    var first = keep[0].date, last = keep[keep.length-1].date;
    weekEl.textContent = keep.length + " cook" + (keep.length === 1 ? "" : "s") +
      " \u00b7 " + prettyDate(first) + " \u2013 " + prettyDate(last);

    var byDate = {};
    keep.forEach(function(r){ (byDate[r.date] = byDate[r.date] || []).push(r); });

    var html = "";
    Object.keys(byDate).sort().forEach(function(date){
      var isToday = date === today;
      var isPast = date < today;
      html += '<section class="day"><div class="dayhead">' +
        '<span class="dayname">' + esc(byDate[date][0].day || "") + '</span>' +
        '<span class="daydate">' + esc(prettyDate(date)) + '</span>' +
        (isToday ? '<span class="todaytag">Today</span>' : '') +
        '</div>';
      byDate[date].forEach(function(r){
        html += '<article class="cook' + (isPast ? " past" : "") + '">' +
          '<div class="cookrow"><span class="client">' + esc(r.client) + '</span>' +
          '<span class="meals">' + esc(r.meals) + ' meals</span></div>' +
          '<div class="window">' + esc(r.slot ? r.slot + " \u00b7 " : "") + esc(r.window || "") + '</div>' +
          (r.notes ? '<div class="notes">' + esc(r.notes) + '</div>' : '') +
          '<div class="links">' +
          (r.groceryUrl
            ? '<a href="' + esc(r.groceryUrl) + '">Grocery list</a>'
            : '<span class="pending">Grocery list coming soon</span>') +
          (r.sheetUrl
            ? '<a class="sheet" href="' + esc(r.sheetUrl) + '">Production sheet</a>'
            : '<span class="pending">Production sheet coming soon</span>') +
          '</div></article>';
      });
      html += '</section>';
    });

    html += '<div class="statusnote">Updates automatically \u2014 links appear here as soon as your documents are ready.</div>';
    content.innerHTML = html;
  }

  function load(){
    fetch(FEED_URL + "?chef=" + encodeURIComponent(chef))
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(data){ render(data.records || []); })
      .catch(function(){ renderError(); });
  }

  if (!CHEF_NAMES[chef]){
    renderPicker();
  } else {
    titleEl.textContent = CHEF_NAMES[chef] + "\u2019s Week";
    load();
    pollTimer = setInterval(load, POLL_MS);
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) load();
    });
  }
</script>
</body>
</html>
